name: 🔦 Lighthouse CI — Performance & SEO Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install serve & Lighthouse CI
        run: |
          npm install -g @lhci/cli serve

      - name: Serve app locally
        run: |
          serve . -l 3000 &
          sleep 3
          echo "Server started on :3000"

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:3000 \
            --collect.numberOfRuns=1 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=warn \
            --assert.assertions.categories:seo=warn \
            --upload.target=temporary-public-storage \
            || true  # Don't fail the build, just report

      - name: Show audit summary
        run: |
          echo "## 🔦 Lighthouse Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "Check the Lighthouse CI output above for scores." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | 90+ |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | 90+ |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO | 90+ |" >> $GITHUB_STEP_SUMMARY
          echo "| Best Practices | 90+ |" >> $GITHUB_STEP_SUMMARY
