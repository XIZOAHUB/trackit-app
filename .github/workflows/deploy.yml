name: 🚀 Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ── Validate ──────────────────────────────────────────────
  validate:
    name: 🔍 Validate Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          files=("index.html" "style.css" "script.js" "sw.js" "manifest.json")
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f"
              missing=1
            else
              echo "✅ Found: $f"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "Build failed: missing required files"
            exit 1
          fi

      - name: Check HTML is valid (basic)
        run: |
          if ! grep -q '<!DOCTYPE html>' index.html; then
            echo "❌ index.html missing DOCTYPE"
            exit 1
          fi
          if ! grep -q 'manifest.json' index.html; then
            echo "⚠️  Warning: manifest.json not linked in index.html"
          fi
          if ! grep -q 'sw.js' index.html; then
            echo "⚠️  Warning: Service Worker not registered in index.html"
          fi
          echo "✅ HTML basic validation passed"

      - name: Check for exposed secrets
        run: |
          echo "Scanning for potential secrets..."
          # Look for common secret patterns
          if grep -rEn "(api_key|apikey|secret|password|token)\s*=\s*['\"][a-zA-Z0-9]{10,}" --include="*.js" --include="*.html" .; then
            echo "❌ Potential secret detected in source files!"
            exit 1
          fi
          echo "✅ No secrets found"

  # ── Deploy ────────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # Upload entire repo root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
